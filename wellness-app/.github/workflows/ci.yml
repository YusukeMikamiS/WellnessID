name: CI

on:
  push:
    branches: [main]
  pull_request:

# ビルドは EAS 側で行う。ここでは lint / 型 / テストのみ回す。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  rules:
    name: Security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      # テストは Node 22 の型除去（type stripping）で .mts をそのまま実行する
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Emulator（Firestore・Storage）は Java 21 以上が必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm i -g firebase-tools
      - name: Run rules tests on emulator
        run: npm run test:rules
